<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Static</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/public.js" defer></script>
</head>
<body>
  <a class="skip" href="#main" data-text="skip">Skip to report</a>
  <header class="masthead"><span class="wordmark">Static<span>Volmit Software</span></span><p data-text="publicProfile">Public player profile</p></header>
  <main id="main" class="public-profile" tabindex="-1">
    <div class="report-heading"><div><p class="eyebrow" data-text="publicProfile">Public player profile</p><h1 id="player-name" data-text="profile">Player profile</h1></div><button id="retry" data-text="publicRetry">Reload profile</button></div>
    <p id="public-status" role="status" aria-live="polite" data-text="publicLoading">Loading public profile...</p>
    <section id="public-report" aria-labelledby="player-name"></section>
    <noscript>JavaScript is required to load this public player profile.</noscript>
  </main>
  <footer><span>Static</span><p data-text="publicScope">Statistics shared by this player. Tracking settings affect recorded values.</p></footer>
</body>
</html>
